<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabir Anand | AI automation and operations</title>
<meta name="description" content="Kabir Anand builds working AI automations for sales, operations and finance teams: lead handling, SLA alerting, voice agents and workflow pipelines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --paper2:#e4e9ee; --grid:#d3dae3; --ink:#101c2b; --mute:#4b5a6c;
  --wire:#2f5bea; --signal:#f26a21; --ok:#14866d;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px}
a{color:inherit}
:focus-visible{outline:3px solid var(--wire);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:800 20px var(--display);text-decoration:none;letter-spacing:-.01em}
nav a{margin-left:22px;text-decoration:none;font-weight:500;color:var(--mute)}
nav a:hover{color:var(--ink)}
.hero{padding:40px 0 20px}
h1{font:800 clamp(40px,7vw,84px)/1 var(--display);letter-spacing:-.035em;max-width:14ch}
.lede{margin-top:22px;max-width:56ch;font-size:19px;color:var(--mute)}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--wire);border-color:var(--wire)}
.btn.ghost:hover{background:var(--paper2)}
